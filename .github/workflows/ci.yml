name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install runtime and test dependencies
        # The project has no requirements.txt / pyproject.toml tracked in
        # the repo (verified by `git ls-files`). The dependencies below
        # are the only third-party packages actually imported by the
        # tracked source (verified by a full import scan of HEAD).
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pymongo \
            pydantic \
            "typing_extensions" \
            pytest

      - name: Run the complete pytest suite
        # pytest.ini configures testpaths=tests, registers the
        # `integration` marker, and conftest.py auto-tags every test
        # under tests/integration/ with that marker. Integration tests
        # use the default PROSHIELD_MONGO_URI (mongodb://127.0.0.1:27017)
        # provided by the `mongodb` service above.
        run: python -m pytest
